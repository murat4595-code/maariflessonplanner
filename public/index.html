                    "[Theme 7] ENG.11.7.R1. Prepare for reading about nature/global problems.",
                    "[Theme 8] ENG.11.8.R1. Prepare for reading about universe/future."
                ],
                "Writing": [
                    "[Theme 2] ENG.11.2.W1. Prepare for writing about classroom life.",
                    "[Theme 2] ENG.11.2.W3. Construct new written content on classroom life.",
                    "[Theme 3] ENG.11.3.W3. Construct new written content on personal life.",
                    "[Theme 4] ENG.11.4.W3. Construct new written content on family life.",
                    "[Theme 6] ENG.11.6.W3. Construct new written content on world/culture.",
                    "[Theme 7] ENG.11.7.W3. Construct new written content on nature/global problems.",
                    "[Theme 8] ENG.11.8.W3. Construct new written content on universe/future."
                ],
                "Grammar": [
                    "[Theme 2] ENG.11.2.G1. Select/use Simple Future, Be Going To, Modals of Obligation.",
                    "[Theme 3] ENG.11.3.G1. Select/use Future Tenses (Mixed), Modals (Can/Could).",
                    "[Theme 4] ENG.11.4.G1. Select/use Past Perfect, Question Tags, Used to/Could.",
                    "[Theme 6] ENG.11.6.G1. Select/use Relative Clauses, Connectors.",

                    "[Theme 8] ENG.11.8.G1. Select/use Zero/First/Second Conditionals, Wishes."
                ],
                "Vocabulary": [
                    "[Theme 2] ENG.11.2.V1. Select/use vocab: Learning Activities, Styles, Tech.",
                    "[Theme 3] ENG.11.3.V1. Select/use vocab: Physical Health, Mental Health, Body.",
                    "[Theme 4] ENG.11.4.V1. Select/use vocab: Family Routines, Traditions, Problems.",
                    "[Theme 6] ENG.11.6.V1. Select/use vocab: Cultural Celebrations, Sports.",
                    "[Theme 7] ENG.11.7.V1. Select/use vocab: Natural Resources, Global Problems.",
                    "[Theme 8] ENG.11.8.V1. Select/use vocab: Future Lifestyles, Technologies."
                ],
                "Pronunciation": [
                    "[Theme 2] ENG.11.2.P1. Pronunciation: Target sounds (vowels/consonants).",
                    "[Theme 3] ENG.11.3.P1. Pronunciation: Target sounds (vowels/consonants).",
                    "[Theme 4] ENG.11.4.P1. Pronunciation: Target sounds (vowels/consonants).",
                    "[Theme 6] ENG.11.6.P1. Pronunciation: Target sounds (consonants).",
                    "[Theme 7] ENG.11.7.P1. Pronunciation: Target sounds (vowels/consonants).",
                    "[Theme 8] ENG.11.8.P1. Pronunciation: Target sounds (consonants)."
                ]
            },
            "12": {
                "Listening": [
                    "[Theme 2] ENG.12.2.L1. Prepare/get ready for listening about personal well-being/social health/economic stability.",
                    "[Theme 2] ENG.12.2.L3. Make sense/derive meaning from content on personal well-being.",
                    "[Theme 3] ENG.12.3.L1. Prepare/get ready for listening about family life/technology/community.",
                    "[Theme 4] ENG.12.4.L1. Prepare/get ready for listening about city/social life/infrastructure.",
                    "[Theme 6] ENG.12.6.L1. Prepare/get ready for listening about universe/future/space."
                ],
                "Speaking": [
                    "[Theme 2] ENG.12.2.S3. Produce meaningful/accurate spoken content on personal well-being.",
                    "[Theme 3] ENG.12.3.S3. Produce meaningful/accurate spoken content on family/technology.",
                    "[Theme 4] ENG.12.4.S3. Produce meaningful/accurate spoken content on city/infrastructure.",
                    "[Theme 6] ENG.12.6.S3. Produce meaningful/accurate spoken content on space/future."
                ],
                "Reading": [
                    "[Theme 2] ENG.12.2.R1. Prepare for reading about personal well-being/social health.",
                    "[Theme 2] ENG.12.2.R3. Make sense/derive meaning from content on personal well-being.",
                    "[Theme 3] ENG.12.3.R1. Prepare for reading about family life/technology.",
                    "[Theme 4] ENG.12.4.R1. Prepare for reading about city/social life.",
                    "[Theme 6] ENG.12.6.R1. Prepare for reading about universe/future."
                ],
                "Writing": [
                    "[Theme 2] ENG.12.2.W3. Construct new written content on personal well-being.",
                    "[Theme 3] ENG.12.3.W3. Construct new written content on family life.",
                    "[Theme 4] ENG.12.4.W3. Construct new written content on city/social life.",
                    "[Theme 6] ENG.12.6.W3. Construct new written content on universe/future."
                ],
                "Grammar": [
                    "[Theme 2] ENG.12.2.G1. Select/use Simple Past/Prog/Perfect/Perfect Prog.",
                    "[Theme 3] ENG.12.3.G1. Select/use Reported Speech (Past Tenses).",
                    "[Theme 4] ENG.12.4.G1. Select/use Future Perfect Tense.",
                    "[Theme 6] ENG.12.6.G1. Select/use Conditional 3, Mixed Conditionals."
                ],
                "Vocabulary": [
                    "[Theme 2] ENG.12.2.V1. Select/use vocab: Social Health (EQ, Bonds), Economic Stability (Fashion, Spending).",
                    "[Theme 3] ENG.12.3.V1. Select/use vocab: Technology Impact (Streaming, Privacy), Family-Community Relations.",
                    "[Theme 4] ENG.12.4.V1. Select/use vocab: Communities (Rural/City), Infrastructure (Planning, Solutions).",
                    "[Theme 6] ENG.12.6.V1. Select/use vocab: Space Organisations (NASA, TSA), Future Plans/Aspirations."
                ],
                "Pronunciation": [
                    "[Theme 2] ENG.12.2.P1. Pronunciation: Target sounds (vowels/consonants).",
                    "[Theme 3] ENG.12.3.P1. Pronunciation: Target sounds (vowels/consonants).",
                    "[Theme 4] ENG.12.4.P1. Pronunciation: Target sounds (vowels/consonants).",
                    "[Theme 6] ENG.12.6.P1. Pronunciation: Target sounds (vowels/consonants)."
                ]
            }
        };

        const DROPDOWN_OPTIONS = {
            durations: ["40 minutes (1 lesson hour)", "80 minutes (2 lesson hours)", "120 minutes (3 lesson hours)"],
            studentProfiles: [
                "Grade 9 (A1-A2 Transition)",
                "Grade 10 (A2-B1)",
                "Grade 11 (B1-B2)",
                "Grade 12 (B2-B2+)",
                "Mixed Proficiency Class",
                "Exam-focused / Academic Group",
                "Vocational High School Profile",
                "High Motivation / Communicative"
            ],
            activityTypes: [
                "Communicative Task (Information Gap)",
                "Role-play & Real-life Simulation",
                "Project-Based Learning (PBL)",
                "Digital Storytelling / Media",
                "Collaborative Problem Solving",
                "Debate / Discussion",
                "Reading Circles / Jigsaw Reading",
                "Gamified Learning (Kahoot/Quizizz)",
                "Process Writing Workshop"
            ],
            assessmentTypes: [
                "Values-based Observation Checklist",
                "Performance Task Rubric",
                "Self-Reflection / Peer-Assessment",
                "Exit Ticket / Mini Quiz",
                "Digital Portfolio Entry",
                "Oral Presentation Rubric"
            ]
        };

        // --- AI SERVICE (server-side, Gemini) ---
        // The browser sends only the form selections to the site's serverless
        // function, which holds the API key and calls Claude. The plan streams
        // back as plain text; onUpdate receives the text generated so far.
        const generateLessonPlan = async (data, onUpdate) => {
            // On Netlify the function shares the site's origin; elsewhere (e.g. GitHub Pages) call it by full URL.
            const API_URL = location.hostname.endsWith("netlify.app") ? "/api/generate" : "https://maariflessonplanner.netlify.app/api/generate";
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            });
            if (!response.ok) {
                const detail = await response.json().catch(() => ({}));
                throw new Error(detail.error || `Request failed (${response.status})`);
            }
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let text = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                text += decoder.decode(value, { stream: true });
                onUpdate(text);
            }
            text += decoder.decode();
            if (text.includes("[ERROR]")) throw new Error(text.slice(text.indexOf("[ERROR]") + 8).trim());
            return text || "No response generated.";
        };

        // --- COMPONENTS ---

        // Markdown Renderer
        const MarkdownRenderer = ({ content }) => {
            const lines = content.split('\n');
            const renderedElements = [];
            
            const parseBold = (text) => text.split(/(\*\*.*?\*\*)/g).map((part, i) => 
                (part.startsWith('**') && part.endsWith('**')) 
                ? <strong key={i} className="font-bold text-slate-900">{part.slice(2, -2)}</strong> 
                : part
            );

            let i = 0;
            while (i < lines.length) {
                const line = lines[i];
                const trimmed = line.trim();

                if (trimmed.startsWith('|') && trimmed.includes('|')) {
                    const tableRows = [];
                    while (i < lines.length && lines[i].trim().startsWith('|')) {
                        tableRows.push(lines[i].trim());
                        i++;
                    }
                    const rows = tableRows.map(r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
                    const headerRow = rows[0];
                    const bodyRows = rows.slice(2); // skip separator

                    renderedElements.push(
                        <div key={`table-${i}`} className="overflow-x-auto my-6 border rounded-xl">
                            <table className="min-w-full divide-y divide-slate-200">
                                <thead className="bg-indigo-50">
                                    <tr>{headerRow.map((h, idx) => <th key={idx} className="px-6 py-4 text-left text-xs font-bold text-indigo-700 uppercase">{parseBold(h)}</th>)}</tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-slate-100">
                                    {bodyRows.map((r, ri) => <tr key={ri}>{r.map((c, ci) => <td key={ci} className="px-6 py-4 text-sm text-slate-600">{parseBold(c)}</td>)}</tr>)}
                                </tbody>
                            </table>
                        </div>
                    );
                    continue;
                }

                if (line.startsWith('# ')) renderedElements.push(<h1 key={i} className="text-3xl font-bold text-red-700 mt-8 mb-4 border-b pb-2">{parseBold(line.replace('# ', ''))}</h1>);
                else if (line.startsWith('## ')) renderedElements.push(<h2 key={i} className="text-xl font-bold text-indigo-700 mt-6 mb-3 flex items-center gap-2"><span className="w-1 h-6 bg-indigo-500 rounded-full inline-block"></span>{parseBold(line.replace('## ', ''))}</h2>);
                else if (trimmed.startsWith('* ') || trimmed.startsWith('- ')) renderedElements.push(<div key={i} className="flex items-start ml-4 mb-2"><span className="mr-2 text-indigo-500">•</span><span className="text-slate-700">{parseBold(trimmed.replace(/^[\*\-]\s/, ''))}</span></div>);
                else if (trimmed === '') renderedElements.push(<div key={i} className="h-3"></div>);
                else renderedElements.push(<p key={i} className="mb-2 text-slate-700 leading-relaxed">{parseBold(line)}</p>);
                
                i++;
            }
            return <div className="space-y-1">{renderedElements}</div>;
        };

        // Result Display
        const ResultDisplay = ({ content, onReset, isStreaming }) => {
            const [isGeneratingDoc, setIsGeneratingDoc] = useState(false);
            const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

            const handleDownloadPDF = async () => {
                setIsGeneratingPdf(true);
                const element = document.getElementById('lesson-plan-content');
                if (window.html2pdf) {
                    await window.html2pdf().set({ margin: 0.5, filename: 'Maarif_Lesson_Plan.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } }).from(element).save();
                }
                setIsGeneratingPdf(false);
            };

            const handleDownloadDocx = async () => {
                setIsGeneratingDoc(true);
                
                // Defensive check for docx library
                if (!window.docx) {
                     alert("Document library failed to load. Please check your internet connection.");
                     setIsGeneratingDoc(false);
                     return;
                }

                try {
                    const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, BorderStyle } = window.docx;
                    const lines = content.split('\n');
                    const children = [new Paragraph({ text: "Maarif Model Lesson Plan", heading: HeadingLevel.TITLE })];
                    
                    let i = 0;
                    while (i < lines.length) {
                        const line = lines[i].trim();
                        if (line.startsWith('|') && line.includes('|')) {
                             const rows = [];
                             while(i < lines.length && lines[i].trim().startsWith('|')) { rows.push(lines[i].trim()); i++; }
                             const parsed = rows.map(r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim())).filter(r => !r[0].includes('---'));
                             
                             if (parsed.length) {
                                children.push(new Table({
                                    rows: parsed.map(r => new TableRow({ children: r.map(c => new TableCell({ children: [new Paragraph(c)], width: { size: 100/r.length, type: WidthType.PERCENTAGE }, borders: { top: {style: BorderStyle.SINGLE, size: 1}, bottom: {style: BorderStyle.SINGLE, size: 1}, left: {style: BorderStyle.SINGLE, size: 1}, right: {style: BorderStyle.SINGLE, size: 1} } })) })),
                                    width: { size: 100, type: WidthType.PERCENTAGE }
                                }));
                             }
                             continue;
                        }
                        if (line.startsWith('# ')) children.push(new Paragraph({ text: line.replace('# ', ''), heading: HeadingLevel.HEADING_1 }));
                        else if (line.startsWith('## ')) children.push(new Paragraph({ text: line.replace('## ', ''), heading: HeadingLevel.HEADING_2 }));
                        else if (line.startsWith('* ')) children.push(new Paragraph({ text: line.replace('* ', ''), bullet: { level: 0 } }));
                        else if (line) children.push(new Paragraph({ text: line }));
                        i++;
                    }

                    const blob = await Packer.toBlob(new Document({ sections: [{ children }] }));
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = "Maarif_Lesson_Plan.docx";
                    link.click();
                } catch (e) { console.error(e); alert("Docx generation error"); }
                setIsGeneratingDoc(false);
            };

            return (
                <div className="animate-fade-in-up">
                    <div className="flex flex-col sm:flex-row justify-between items-center mb-6 no-print gap-4">
                        <button onClick={onReset} disabled={isStreaming} className="disabled:opacity-50 flex items-center gap-2 text-slate-600 hover:text-indigo-600 font-medium bg-white px-4 py-2 rounded-lg border border-slate-200"><Icons.ArrowLeft className="w-4 h-4" /> Create New Plan</button>
                        <div className="flex gap-3">
                            {isStreaming && <span className="flex items-center gap-2 text-sm text-indigo-600 font-medium"><Icons.Sparkles className="w-4 h-4 animate-pulse" /> Writing your lesson plan...</span>}
                            {!isStreaming && <>
                            <button onClick={handleDownloadDocx} disabled={isGeneratingDoc} className="flex items-center gap-2 bg-white text-indigo-700 px-5 py-2 rounded-lg font-semibold border border-indigo-100 hover:bg-indigo-50">{isGeneratingDoc ? "..." : <Icons.FileText className="w-4 h-4" />} DOCX</button>
                            <button onClick={handleDownloadPDF} disabled={isGeneratingPdf} className="flex items-center gap-2 bg-indigo-600 text-white px-5 py-2 rounded-lg font-semibold shadow-md hover:bg-indigo-700">{isGeneratingPdf ? "..." : <Icons.Download className="w-4 h-4" />} PDF</button>
                            </>}
                        </div>
                    </div>
                    <div id="lesson-plan-content" className="bg-white rounded-xl shadow-xl p-8 border border-slate-200">
                        <div className="print-only hidden mb-8 border-b-2 border-red-600 pb-4"><h1 className="text-2xl font-bold">Maarif Lesson Plan</h1></div>
                        <MarkdownRenderer content={content} />
                    </div>
                </div>
            );
        };

        // Input Form
        const InputForm = ({ onSubmit, isLoading }) => {
            const [formData, setFormData] = useState({ 
                gradeLevel: "9", 
                outcomes: "", 
                topic: "", 
                targetLanguage: GRAMMAR_BY_GRADE["9"][0], // Default based on grade 9
                duration: DROPDOWN_OPTIONS.durations[0], 
                studentProfile: DROPDOWN_OPTIONS.studentProfiles[0], 
                activityTypes: DROPDOWN_OPTIONS.activityTypes[0], 
                assessmentType: DROPDOWN_OPTIONS.assessmentTypes[0] 
            });
            const [selectedSkill, setSelectedSkill] = useState(SKILLS[0]);
            const [outcomesList, setOutcomesList] = useState([]);

            // Available Grammar Options based on Grade
            const availableGrammar = useMemo(() => {
                return GRAMMAR_BY_GRADE[formData.gradeLevel] || [];
            }, [formData.gradeLevel]);

            useMemo(() => {
                const list = MAARIF_OUTCOMES[formData.gradeLevel]?.[selectedSkill] || [];
                setOutcomesList(list);
                
                // When grade changes, update outcomes, topic, AND target language
                setFormData(prev => ({ 
                    ...prev, 
                    outcomes: list[0] || "", 
                    topic: TOPICS_BY_GRADE[prev.gradeLevel][0],
                    // Only reset grammar if it hasn't been manually set to something valid, or just always reset on grade change
                    targetLanguage: GRAMMAR_BY_GRADE[prev.gradeLevel][0]
                }));
            }, [formData.gradeLevel, selectedSkill]);

            const handleSubmit = (e) => { e.preventDefault(); onSubmit(formData); };

            return (
                <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                    <div className="bg-gradient-to-r from-red-700 to-red-600 p-6 text-white">
                        <h2 className="text-2xl font-bold flex items-center gap-2"><Icons.BookOpen className="w-6 h-6" /> Lesson Details</h2>
                        <p className="text-red-100 mt-2 text-sm opacity-90">Based on Türkiye Yüzyılı Maarif Modeli (Erdem-Değer-Eylem).</p>
                    </div>
                    <form onSubmit={handleSubmit} className="p-8 space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div><label className="block text-sm font-semibold text-slate-700 mb-2 flex gap-2"><Icons.GraduationCap className="w-4 h-4 text-indigo-500"/>Grade</label><select className="w-full px-4 py-3 rounded-lg border bg-slate-50" value={formData.gradeLevel} onChange={e => setFormData({...formData, gradeLevel: e.target.value})}>{["9","10","11","12"].map(g => <option key={g} value={g}>{g}th Grade</option>)}</select></div>
                            <div><label className="block text-sm font-semibold text-slate-700 mb-2 flex gap-2"><Icons.Clock className="w-4 h-4 text-indigo-500"/>Time</label><select className="w-full px-4 py-3 rounded-lg border bg-slate-50" value={formData.duration} onChange={e => setFormData({...formData, duration: e.target.value})}>{DROPDOWN_OPTIONS.durations.map(d => <option key={d} value={d}>{d}</option>)}</select></div>
                        </div>
                        <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                            <div className="grid md:grid-cols-3 gap-6">
                                <div><label className="block text-sm font-semibold text-slate-700 mb-2 flex gap-2"><Icons.Puzzle className="w-4 h-4 text-indigo-500"/>Skill</label><select className="w-full px-4 py-3 rounded-lg border bg-white" value={selectedSkill} onChange={e => setSelectedSkill(e.target.value)}>{SKILLS.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                                <div className="md:col-span-2"><label className="block text-sm font-semibold text-slate-700 mb-2 flex gap-2"><Icons.Target className="w-4 h-4 text-indigo-500"/>Outcome (Sample)</label><select className="w-full px-4 py-3 rounded-lg border bg-white truncate" value={formData.outcomes} onChange={e => setFormData({...formData, outcomes: e.target.value})}>{outcomesList.map((o, i) => <option key={i} value={o}>{o}</option>)}</select></div>
                            </div>
                        </div>
                        <div className="grid md:grid-cols-2 gap-6">
                            <div><label className="block text-sm font-semibold text-slate-700 mb-2 flex gap-2"><Icons.Globe className="w-4 h-4 text-indigo-500"/>Maarif Theme</label><select className="w-full px-4 py-3 rounded-lg border bg-slate-50" value={formData.topic} onChange={e => setFormData({...formData, topic: e.target.value})}>{(TOPICS_BY_GRADE[formData.gradeLevel]||[]).map(t => <option key={t} value={t}>{t}</option>)}</select></div>
                            <div><label className="block text-sm font-semibold text-slate-700 mb-2 flex gap-2"><Icons.BookOpen className="w-4 h-4 text-indigo-500"/>Grammar Focus</label><select className="w-full px-4 py-3 rounded-lg border bg-slate-50" value={formData.targetLanguage} onChange={e => setFormData({...formData, targetLanguage: e.target.value})}>{availableGrammar.map(t => <option key={t} value={t}>{t}</option>)}</select></div>
                        </div>
                         <div className="grid md:grid-cols-2 gap-6">
                            <div><label className="block text-sm font-semibold text-slate-700 mb-2">Student Profile</label><select className="w-full px-4 py-3 rounded-lg border bg-slate-50" value={formData.studentProfile} onChange={e => setFormData({...formData, studentProfile: e.target.value})}>{DROPDOWN_OPTIONS.studentProfiles.map(p => <option key={p} value={p}>{p}</option>)}</select></div>
                            <div><label className="block text-sm font-semibold text-slate-700 mb-2 flex gap-2"><Icons.Layers className="w-4 h-4 text-indigo-500"/>Activity Type</label><select className="w-full px-4 py-3 rounded-lg border bg-slate-50" value={formData.activityTypes} onChange={e => setFormData({...formData, activityTypes: e.target.value})}>{DROPDOWN_OPTIONS.activityTypes.map(a => <option key={a} value={a}>{a}</option>)}</select></div>
                        </div>
                         <div><label className="block text-sm font-semibold text-slate-700 mb-2 flex gap-2"><Icons.FileText className="w-4 h-4 text-indigo-500"/>Assessment</label><select className="w-full px-4 py-3 rounded-lg border bg-slate-50" value={formData.assessmentType} onChange={e => setFormData({...formData, assessmentType: e.target.value})}>{DROPDOWN_OPTIONS.assessmentTypes.map(a => <option key={a} value={a}>{a}</option>)}</select></div>
                        <button type="submit" disabled={isLoading} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg disabled:opacity-50 flex justify-center items-center gap-3">{isLoading ? "Generating..." : <><Icons.Sparkles className="w-5 h-5" /> Generate Lesson Plan</>}</button>
                    </form>
                </div>
            );
        };

        // Main App
        const App = () => {
            const [lessonPlan, setLessonPlan] = useState(null);
            const [isLoading, setIsLoading] = useState(false);

            const handleGenerate = async (data) => {
                setIsLoading(true);
                setLessonPlan("");
                try {
                    const plan = await generateLessonPlan(data, setLessonPlan);
                    setLessonPlan(plan);
                } catch (error) {
                    console.error(error);
                    setLessonPlan(null);
                    alert(`Error: ${error.message}`);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen pb-12">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm mb-8">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2"><div className="bg-red-600 p-1.5 rounded-lg"><Icons.BookOpen className="w-5 h-5 text-white" /></div><h1 className="text-lg font-bold text-slate-800">Maarif Lesson Planner</h1></div>
                            <div className="flex items-center gap-1 text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full border"><Icons.Sparkles className="w-3 h-3 text-indigo-500" /><span>AI Powered · Gemini</span></div>
                        </div>
                    </header>
                    <main className="max-w-4xl mx-auto px-4">
                        {lessonPlan === null ? <div className="animate-fade-in"><div className="text-center mb-8"><h2 className="text-3xl font-extrabold text-slate-900 mb-3">Create Your Lesson Plan</h2><p className="text-lg text-slate-600 max-w-2xl mx-auto">Aligned with <span className="text-red-600 font-semibold">Türkiye Yüzyılı Maarif Modeli</span></p></div><InputForm onSubmit={handleGenerate} isLoading={isLoading} /></div> : <ResultDisplay content={lessonPlan} isStreaming={isLoading} onReset={() => setLessonPlan(null)} />}
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
